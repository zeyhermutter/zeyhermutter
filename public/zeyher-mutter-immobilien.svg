<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 320" role="img" aria-labelledby="title desc">
  <title id="title">Zeyher &amp; Mutter Immobilien</title>
  <desc id="desc">Geometrisches Hausmonogramm in Navy und Gold mit dem Schriftzug Zeyher &amp; Mutter Immobilien.</desc>
  <defs>
    <style>
      .navy-stroke{fill:none;stroke:#0A223A}
      .gold-stroke{fill:none;stroke:#B58A45}
      .gold-fill{fill:#B58A45;stroke:none}
      .wordmark{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:4px}
      .descriptor{font-family:Montserrat,Arial,sans-serif;font-weight:500;letter-spacing:13px}
    </style>
  </defs>

  <g transform="translate(24 18)" stroke-width="10" stroke-linecap="square" stroke-linejoin="miter">
    <path class="navy-stroke" d="M32 236V96L139 25L181 54"/>
    <path class="gold-stroke" d="M181 54L196 64V46H220V82L251 102V236"/>
    <path class="navy-stroke" d="M66 116H159L70 224H162"/>
    <path class="gold-stroke" d="M165 137L201 183L237 137V224"/>
    <g class="gold-fill">
      <rect x="132" y="182" width="15" height="15"/>
      <rect x="153" y="182" width="15" height="15"/>
      <rect x="132" y="203" width="15" height="15"/>
      <rect x="153" y="203" width="15" height="15"/>
    </g>
  </g>

  <line x1="324" y1="70" x2="324" y2="252" stroke="#B58A45" stroke-width="3"/>

  <text x="395" y="145" class="wordmark" font-size="76">
    <tspan fill="#0A223A">ZEYHER </tspan><tspan fill="#B58A45">&amp;</tspan><tspan fill="#0A223A"> MUTTER</tspan>
  </text>

  <line x1="398" y1="207" x2="548" y2="207" stroke="#B58A45" stroke-width="3"/>
  <text x="585" y="218" class="descriptor" font-size="27" fill="#B58A45">IMMOBILIEN</text>
  <line x1="1135" y1="207" x2="1328" y2="207" stroke="#B58A45" stroke-width="3"/>
</svg>
