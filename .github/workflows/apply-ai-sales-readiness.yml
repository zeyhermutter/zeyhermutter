              if import_anchor not in s:
                  raise SystemExit('lead-sales-readiness import anchor missing')
              s = s.replace(import_anchor, import_anchor + ai_import)

          loader_anchor = '      canTask: canTask === true,\n'
          loader_add = '      canTask: canTask === true,\n      aiConfigured:\n        context.cloudflare.env.SALES_READINESS_AI_ENABLED === "true" &&\n        Boolean(context.cloudflare.env.OPENAI_API_KEY),\n'
          if 'aiConfigured:' not in s:
              if loader_anchor not in s:
                  raise SystemExit('lead-sales-readiness loader anchor missing')
              s = s.replace(loader_anchor, loader_add, 1)

          old = '  const { viewModel, profile, canWrite, canFinalize, canTask } = useLoaderData<typeof loader>();'
          new = '  const { viewModel, profile, canWrite, canFinalize, canTask, aiConfigured } = useLoaderData<typeof loader>();'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('lead-sales-readiness destructuring anchor missing')

          workspace_anchor = '      <SalesReadinessWorkspace\n        viewModel={viewModel}\n'
          panel = '''      {viewModel.check.id ? (\n        <SalesReadinessAiPanel\n          leadId={viewModel.lead.id}\n          scenarios={viewModel.scenarios.map(({ id, kind, title }) => ({ id, kind, title }))}\n          canWrite={canWrite && viewModel.check.status !== "FINALIZED"}\n          configured={aiConfigured}\n        />\n      ) : null}\n\n'''
          if '<SalesReadinessAiPanel' not in s:
              if workspace_anchor not in s:
                  raise SystemExit('lead-sales-readiness workspace anchor missing')
              s = s.replace(workspace_anchor, panel + workspace_anchor, 1)
          path.write_text(s)

          # CRM-consistent styling for the AI card.
          path = Path('app/sales-readiness-editor.css')
          s = path.read_text()
          marker = '/* Sales readiness AI writing blocks */'
          if marker not in s:
              s += r'''

/* Sales readiness AI writing blocks */
.readiness-ai-card{width:min(1320px,calc(100% - 40px));margin:0 auto 22px;display:grid;gap:18px;padding:22px;background:#141a1b;border:1px solid #293536;border-radius:18px;color:#eef2f3}.readiness-ai-head{align-items:flex-start}.readiness-ai-head h2{margin:3px 0 7px;color:#eef2f3}.readiness-ai-badge{display:inline-flex;align-items:center;min-height:30px;padding:6px 10px;border:1px solid #3f5960;border-radius:999px;background:#172327;color:#bfe0e7;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.readiness-ai-groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.readiness-ai-group{display:grid;gap:10px;padding:15px;border:1px solid #293536;border-radius:13px;background:#111718}.readiness-ai-group>strong{font-size:12px;color:#cbd4d5}.readiness-ai-actions{display:flex;gap:8px;flex-wrap:wrap}.readiness-ai-actions .secondary-button{min-height:38px;padding:8px 11px;font-size:12px}.readiness-ai-actions button:disabled{cursor:not-allowed;opacity:.5}.readiness-ai-warning,.readiness-ai-feedback{margin:0}.readiness-ai-note{color:#778587;line-height:1.55}.readiness-ai-note::before{content:"Hinweis · ";color:#9fabad;font-weight:700}@media(max-width:900px){.readiness-ai-groups{grid-template-columns:1fr}}@media(max-width:700px){.readiness-ai-card{width:min(100% - 24px,1320px);padding:18px}.readiness-ai-actions{display:grid}.readiness-ai-actions .secondary-button{width:100%;min-height:44px}}
'''
          path.write_text(s)

          # Remove this one-time patch workflow from the resulting feature commit.
          if branch_workflow.exists():
              branch_workflow.unlink()
          PY

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Beta: add ChatGPT writing blocks to sales readiness"
          git push origin HEAD:codex/verkaufsfertig-positionierung
