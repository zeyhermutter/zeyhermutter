name: PROD Migrations Preflight

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prod-migrations-preflight
  cancel-in-progress: true

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Discover current Supabase CLI commands
        run: |
          npx --yes supabase@latest --version
          npx --yes supabase@latest link --help >/dev/null
          npx --yes supabase@latest db push --help >/dev/null

      # Kein Datenbank-Passwort (27.10.2026): Die Supabase-CLI meldet sich mit
      # SUPABASE_ACCESS_TOKEN ueber eine kurzlebige Anmelderolle an -- so wie
      # lokal beim db push. Das postgres-Passwort bleibt aus GitHub heraus.

      - name: Link production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase@latest link --project-ref vtmtxaaojbqqzwxkodye

      - name: Preview pending production migrations only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase@latest db push --dry-run
