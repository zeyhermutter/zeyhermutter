name: Deploy PROD from develop once

on:
  push:
    branches:
      - ops/deploy-sales-readiness-production
    paths:
      - .github/workflows/deploy-production-from-develop-once.yml

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build production
        run: pnpm run build:production
      - name: Verify production target
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync('build/server/wrangler.json','utf8'));
          const v = c.vars || {};
          if (c.name !== 'zeyhermutter-production') throw new Error(`Unexpected worker ${c.name}`);
          if (v.APP_ENV !== 'production') throw new Error(`Unexpected APP_ENV ${v.APP_ENV}`);
          if (v.SUPABASE_URL !== 'https://vtmtxaaojbqqzwxkodye.supabase.co') throw new Error(`Unexpected Supabase ${v.SUPABASE_URL}`);
          if (v.SALES_READINESS_BACKEND_ENABLED !== 'false' || v.SELLER_CHECK_PUBLIC_ENABLED !== 'false') throw new Error('Production feature flags are not safely disabled');
          NODE
      - name: Production dry run
        run: CLOUDFLARE_ENV=production pnpm exec wrangler deploy --dry-run
      - name: Deploy production
        run: CLOUDFLARE_ENV=production pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
