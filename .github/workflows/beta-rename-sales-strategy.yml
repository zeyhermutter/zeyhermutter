name: Rename sales strategy check on BETA

on:
  push:
    branches:
      - codex/verkaufsfertig-positionierung
    paths:
      - .github/workflows/beta-rename-sales-strategy.yml

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/verkaufsfertig-positionierung
          fetch-depth: 2
      - name: Replace user-facing name everywhere
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, subprocess

          old = "Verkaufsfertig-Check"
          new = "Verkaufsstrategie-Check"
          files = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          changed = []
          for name in files:
              if not name:
                  continue
              if name == ".github/workflows/beta-rename-sales-strategy.yml":
                  continue
              if name.startswith("supabase/migrations/"):
                  continue
              path = pathlib.Path(name)
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              if old not in text:
                  continue
              path.write_text(text.replace(old, new), encoding="utf-8")
              changed.append(name)
          print("Changed files:")
          print("\n".join(changed) if changed else "(none)")
          if not changed:
              raise SystemExit("No occurrences found; refusing empty rename commit")
          PY
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/beta-rename-sales-strategy.yml
          git config user.name "zeyhermutter"
          git config user.email "playsony@web.de"
          git add -A
          git diff --cached --check
          git commit -m "Beta: rename Verkaufsfertig-Check to Verkaufsstrategie-Check"
          git push origin HEAD:codex/verkaufsfertig-positionierung
