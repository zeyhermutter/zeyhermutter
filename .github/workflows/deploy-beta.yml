name: Deploy BETA

on:
  push:
    branches: [codex/verkaufsfertig-positionierung]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-beta-sales-readiness
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: beta
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify deploy target
        run: |
          node -e "const c=require('./wrangler.json'); if(c.name!=='zeyhermutter'||c.vars.APP_ENV!=='beta'||c.vars.SUPABASE_URL!=='https://zqhcxudpfwsfuokencvy.supabase.co') process.exit(1)"
      - name: Full diff check
        run: git diff --check HEAD^ HEAD
      - name: Secret scan
        run: |
          if git grep -nE 'SELLER_CHECK_RESPONSIBLE_USER_ID[[:space:]]*[:=][[:space:]]*["'"'"']?[0-9a-fA-F-]{36}|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*[:=][[:space:]]*["'"'"'][^"'"'"']+' -- ':!pnpm-lock.yaml'; then
            echo "Potential committed secret detected"
            exit 1
          fi
      - name: Verify BETA seller intake routing
        env:
          SMOKE_KEY: beta-smoke-seller-check-20260901-001
        run: |
          response=$(curl --fail-with-body --silent --show-error \
            -X POST 'https://zqhcxudpfwsfuokencvy.supabase.co/functions/v1/website-inquiry' \
            -H 'content-type: application/json' \
            --data "{\"kind\":\"SELLER_CHECK\",\"first_name\":\"SYNTHETIC\",\"last_name\":\"BETA-SMOKE\",\"email\":\"synthetic.salesreadiness.beta@example.invalid\",\"postal_code\":\"80331\",\"city\":\"München\",\"property_type\":\"DETACHED_HOUSE\",\"property_condition\":\"SYNTHETIC TEST\",\"sale_timeframe\":\"SYNTHETIC TEST\",\"requested_support\":[\"ASSESSMENT\"],\"message\":\"SYNTHETIC BETA SELLER CHECK SMOKE TEST\",\"consent\":true,\"company\":\"\",\"submission_key\":\"${SMOKE_KEY}\",\"source_url\":\"/verkaufsfertig-check?synthetic-smoke=1\"}"
          )
          node -e 'const r=JSON.parse(process.argv[1]); if(r.ok!==true) process.exit(1)' "$response"
      - name: Wrangler help
        run: pnpm exec wrangler deploy --help >/dev/null
      - name: Typecheck
        run: pnpm run typecheck
      - name: BETA checks
        run: pnpm run check:beta
      - name: Explicit Wrangler dry run
        run: pnpm exec wrangler deploy --dry-run
      - name: Deploy BETA only
        run: pnpm run deploy:beta
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
