name: Deploy BETA

on:
  push:
    branches: [codex/verkaufsfertig-positionierung]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-beta-sales-readiness
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: beta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify deploy target
        run: |
          node -e "const c=require('./wrangler.json'); if(c.name!=='zeyhermutter'||c.vars.APP_ENV!=='beta'||c.vars.SUPABASE_URL!=='https://zqhcxudpfwsfuokencvy.supabase.co') process.exit(1)"
      - name: Full diff check
        run: git diff --check HEAD^ HEAD
      - name: Secret scan
        run: |
          if git grep -nE 'SELLER_CHECK_RESPONSIBLE_USER_ID[[:space:]]*[:=][[:space:]]*["'"'"']?[0-9a-fA-F-]{36}|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*[:=][[:space:]]*["'"'"'][^"'"'"']+' -- ':!pnpm-lock.yaml'; then
            echo "Potential committed secret detected"
            exit 1
          fi
      # Dieser Schritt laeuft ausschliesslich hier und ausschliesslich gegen das
      # BETA-Projekt; im Workflow "Deploy PRODUCTION" gibt es ihn nicht.
      #
      # Die erzeugten Datensaetze duerfen NICHT geloescht werden. Die
      # Intake-Funktion dedupliziert ueber SMOKE_KEY: solange der Lead existiert
      # - auch archiviert - gibt sie ihn zurueck und legt nichts Neues an. Wird
      # er geloescht, entsteht beim naechsten Deploy ein neuer.
      #
      # Der Lauf legt zwei Datensaetze an, den Lead ZM-L-000068 und den Kontakt
      # ZM-K-000105. Beide sind auf BETA archiviert und tragen eine Notiz.
      # Der Kontakt muss mit archiviert bleiben: als aktiver Kontakt stand er
      # sonst in jeder Kontaktauswahl der Anwendung zur Auswahl. Nachgeprueft:
      # mit beiden archiviert liefert die Funktion weiterhin "dedupliziert" und
      # legt weder Lead noch Kontakt neu an.
      - name: Verify BETA seller intake routing
        env:
          SMOKE_KEY: beta-smoke-seller-check-20260901-001
        run: |
          response=$(curl --fail-with-body --silent --show-error \
            -X POST 'https://zqhcxudpfwsfuokencvy.supabase.co/functions/v1/website-inquiry' \
            -H 'content-type: application/json' \
            --data "{\"kind\":\"SELLER_CHECK\",\"first_name\":\"SYNTHETIC\",\"last_name\":\"BETA-SMOKE\",\"email\":\"synthetic.salesreadiness.beta@example.invalid\",\"postal_code\":\"80331\",\"city\":\"München\",\"property_type\":\"DETACHED_HOUSE\",\"property_condition\":\"SYNTHETIC TEST\",\"sale_timeframe\":\"SYNTHETIC TEST\",\"requested_support\":[\"ASSESSMENT\"],\"message\":\"SYNTHETIC BETA SELLER CHECK SMOKE TEST\",\"consent\":true,\"company\":\"\",\"submission_key\":\"${SMOKE_KEY}\",\"source_url\":\"/verkaufsfertig-check?synthetic-smoke=1\"}"
          )
          node -e 'const r=JSON.parse(process.argv[1]); if(r.ok!==true) process.exit(1)' "$response"
      - name: Wrangler help
        run: pnpm exec wrangler deploy --help >/dev/null
      - name: Typecheck
        run: pnpm run typecheck
      - name: BETA checks
        run: pnpm run check:beta
      - name: Explicit Wrangler dry run
        run: pnpm exec wrangler deploy --dry-run
      # deploy:beta spielt jetzt zuerst die Edge-Funktionen aus und dann den
      # Worker. Ohne SUPABASE_ACCESS_TOKEN bricht der Schritt ab, statt den
      # Worker gegen eine veraltete Funktion zu stellen -- siehe
      # scripts/check-edge-funktionen.mjs.
      - name: Deploy BETA only
        run: pnpm run deploy:beta
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
