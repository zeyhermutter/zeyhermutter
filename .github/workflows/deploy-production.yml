name: Deploy PROD

on:
  workflow_dispatch:
    inputs:
      release_confirmation:
        description: Type DEPLOY_PRODUCTION to confirm the release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.release_confirmation == 'DEPLOY_PRODUCTION'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Die Edge-Funktionen gehen mit. Bis zum 07.10.2026 fehlte dieser
      # Schritt, und PRODUKTION lief fuenf Wochen auf Fassung 1 der
      # Intake-Funktion -- die drei der fuenf oeffentlichen Formulare mit 400
      # abgewiesen haette. scripts/check-edge-funktionen.mjs haelt die Luecke zu.
      - run: pnpm run deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DEPLOY_PRODUCTION: "YES"
