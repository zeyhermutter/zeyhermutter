name: PROD Preflight

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prod-preflight
  cancel-in-progress: true

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify production configuration
        run: |
          node -e "const c=require('./wrangler.json'); const p=c.env.production; if(p.name!=='zeyhermutter-production'||p.vars.APP_ENV!=='production'||p.vars.SUPABASE_URL!=='https://vtmtxaaojbqqzwxkodye.supabase.co') process.exit(1)"

      - name: Verify production deploy credentials
        run: pnpm run deploy:zugaenge:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify production migration state read-only
        run: pnpm run deploy:migrationsstand:production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify production release guard
        run: node scripts/guard-production-deploy.mjs
        env:
          DEPLOY_PRODUCTION: "YES"

      - name: Production typecheck, build and Wrangler dry-run only
        run: pnpm run check:production
