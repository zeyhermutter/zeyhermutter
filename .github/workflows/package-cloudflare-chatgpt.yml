name: Paket fuer Cloudflare erstellen

on:
  push:
    branches:
      - chatgpt/cloudflare-paket-20261022

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 598a84d713643a46cebc5a9f8805ca4bbb4f9535
          fetch-depth: 1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm

      - name: Abhaengigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: BETA bauen
        run: pnpm run build:beta

      - name: Cloudflare-Bundle erzeugen
        run: |
          rm -rf cloudflare-paket
          mkdir -p cloudflare-paket/worker-bundle cloudflare-paket/source
          pnpm exec wrangler deploy --dry-run --outdir cloudflare-paket/worker-bundle

      - name: Vollstaendigen Quellstand beilegen
        run: |
          rsync -a ./ cloudflare-paket/source/ \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude 'cloudflare-paket/'
          printf '%s\n' '598a84d713643a46cebc5a9f8805ca4bbb4f9535' > cloudflare-paket/BETA-COMMIT.txt

      - name: Hinweise beilegen
        run: |
          cat > cloudflare-paket/README-CLOUDFLARE.txt <<'EOF'
          ZeyherMutter – Cloudflare-Paket
          =================================

          Stand
          -----
          BETA-Commit:
          598a84d713643a46cebc5a9f8805ca4bbb4f9535

          Der Stand wurde vor dem Paketieren erfolgreich durch die bestehende
          BETA-Pruefkette gebaut und deployed.

          Inhalt
          ------
          worker-bundle/
            Ausgabe von:
              pnpm exec wrangler deploy --dry-run --outdir worker-bundle
            nach einem erfolgreichen:
              pnpm run build:beta

          source/
            Vollstaendiger Quellstand des BETA-Commits ohne .git und node_modules.
            Darin liegen auch die Supabase Edge Functions, einschliesslich
            supabase/functions/website-analytics/.

          WICHTIG ZU CLOUDFLARE
          ---------------------
          Dieses Projekt ist ein React-Router-Worker mit Cloudflare Vite Plugin,
          Worker-Konfiguration und Supabase Edge Functions. Es ist KEIN reiner
          statischer Pages-Ordner.

          Fuer diesen Projekttyp ist der sichere, reproduzierbare Weg:
            1. source/ als Projekt verwenden
            2. pnpm install --frozen-lockfile
            3. pnpm run build:beta
            4. pnpm exec wrangler deploy

          Fuer den vollstaendigen bestehenden BETA-Deploy inklusive Supabase
          Edge Functions wird im Projekt verwendet:
            pnpm run deploy:beta

          Dafuer werden die bereits im CI hinterlegten Geheimnisse benoetigt:
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
            SUPABASE_ACCESS_TOKEN

          Geheimnisse sind NICHT in diesem ZIP enthalten.

          Die Dateien unter worker-bundle/ zeigen exakt, was Wrangler nach dem
          Bundling an Cloudflare uebergeben wuerde. Ein einfaches Hochladen des
          ZIPs in einen statischen Pages-Upload ersetzt bei diesem Projekt den
          Worker-/Wrangler-Deploy nicht.

          Statistik
          ----------
          Die versteckte Statistik liegt nach dem Deploy unter:
            /crm/website/statistik

          Sie ist nicht in der Navigation verlinkt und verlangt intern
          die Berechtigung audit.read.
          EOF

      - name: Paket als ZIP-Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: ZeyherMutter-Cloudflare-Paket
          path: cloudflare-paket/
          if-no-files-found: error
          compression-level: 9
