name: Apply AI UI

on:
  push:
    branches: [codex/verkaufsfertig-positionierung]
    paths:
      - .github/workflows/apply-ai-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    environment: beta
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Sync OpenAI key to BETA when configured
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY_PRESENT=false"
          else
            pnpm install --frozen-lockfile
            printf '%s' "$OPENAI_API_KEY" | pnpm exec wrangler secret put OPENAI_API_KEY
            echo "OPENAI_API_KEY_PRESENT=true"
          fi
      - name: Patch sales readiness UI
        run: |
          python - <<'PY'
          from pathlib import Path

          route = Path('app/routes/lead-sales-readiness.tsx')
          s = route.read_text()
          anchor = 'import { SalesReadinessWorkspace } from "~/components/sales-readiness-workspace";\n'
          ai_import = 'import { SalesReadinessAiPanel } from "~/components/sales-readiness-ai-panel";\n'
          if ai_import not in s:
              if anchor not in s:
                  raise SystemExit('import anchor missing')
              s = s.replace(anchor, anchor + ai_import, 1)
          loader_anchor = '      canTask: canTask === true,\n'
          loader_value = '      canTask: canTask === true,\n      aiConfigured:\n        context.cloudflare.env.SALES_READINESS_AI_ENABLED === "true" &&\n        Boolean(context.cloudflare.env.OPENAI_API_KEY),\n'
          if 'aiConfigured:' not in s:
              if loader_anchor not in s:
                  raise SystemExit('loader anchor missing')
              s = s.replace(loader_anchor, loader_value, 1)
          old = '  const { viewModel, profile, canWrite, canFinalize, canTask } = useLoaderData<typeof loader>();'
          new = '  const { viewModel, profile, canWrite, canFinalize, canTask, aiConfigured } = useLoaderData<typeof loader>();'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('loader destructure anchor missing')
          workspace_anchor = '      <SalesReadinessWorkspace\n        viewModel={viewModel}\n'
          panel = '      {viewModel.check.id ? (\n        <SalesReadinessAiPanel\n          leadId={viewModel.lead.id}\n          scenarios={viewModel.scenarios.map(({ id, kind, title }) => ({ id, kind, title }))}\n          canWrite={canWrite && viewModel.check.status !== "FINALIZED"}\n          configured={aiConfigured}\n        />\n      ) : null}\n\n'
          if '<SalesReadinessAiPanel' not in s:
              if workspace_anchor not in s:
                  raise SystemExit('workspace anchor missing')
              s = s.replace(workspace_anchor, panel + workspace_anchor, 1)
          route.write_text(s)

          css = Path('app/sales-readiness-editor.css')
          c = css.read_text()
          marker = '/* Sales readiness AI writing blocks */'
          addition = '\n\n/* Sales readiness AI writing blocks */\n.readiness-ai-card{width:min(1320px,calc(100% - 40px));margin:0 auto 22px;display:grid;gap:18px;padding:22px;background:#141a1b;border:1px solid #293536;border-radius:18px;color:#eef2f3}.readiness-ai-head{align-items:flex-start}.readiness-ai-head h2{margin:3px 0 7px;color:#eef2f3}.readiness-ai-badge{display:inline-flex;align-items:center;min-height:30px;padding:6px 10px;border:1px solid #3f5960;border-radius:999px;background:#172327;color:#bfe0e7;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.readiness-ai-groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.readiness-ai-group{display:grid;gap:10px;padding:15px;border:1px solid #293536;border-radius:13px;background:#111718}.readiness-ai-group>strong{font-size:12px;color:#cbd4d5}.readiness-ai-actions{display:flex;gap:8px;flex-wrap:wrap}.readiness-ai-actions .secondary-button{min-height:38px;padding:8px 11px;font-size:12px}.readiness-ai-actions button:disabled{cursor:not-allowed;opacity:.5}.readiness-ai-warning,.readiness-ai-feedback{margin:0}.readiness-ai-note{color:#778587;line-height:1.55}.readiness-ai-note::before{content:"Hinweis · ";color:#9fabad;font-weight:700}@media(max-width:900px){.readiness-ai-groups{grid-template-columns:1fr}}@media(max-width:700px){.readiness-ai-card{width:min(100% - 24px,1320px);padding:18px}.readiness-ai-actions{display:grid}.readiness-ai-actions .secondary-button{width:100%;min-height:44px}}\n'
          if marker not in c:
              css.write_text(c + addition)

          workflow = Path('.github/workflows/apply-ai-ui.yml')
          if workflow.exists():
              workflow.unlink()
          PY
      - name: Commit UI integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Beta: wire ChatGPT writing blocks into sales readiness"
          git push origin HEAD:codex/verkaufsfertig-positionierung
